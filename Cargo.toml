[package]
name = "bdtv_hub"
version = "0.1.0"
edition = "2024"
authors = ["peter2500zz <peter2500zz@qq.com>"]
license = "Apache-2.0"
repository = "https://github.com/bdtv-lab/bdtv_hub"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
azalea-chat = "0.16.0"
dotenvy = "0.15.7"
kyori-component-json = "0.2.1"
onebot_v11 = "0.1.5"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
serde_regex = "1.2.0"
smaragdine = { git = "https://github.com/peter2500zz/smaragdine.git", version = "0.2.0", branch = "experimental" , features = ["async", "macros"] }
time = { version = "0.3.55", features = ["local-offset", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }
uuid = { version = "1.24.1", features = ["serde", "v4"] }
